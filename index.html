<body>

            <div class="card col-7">
                <div class="card-header">
                    Payment form example
                </div>
                <div class="card-body">
                    <form action="">
                        <div class="container my-3">
                            <div class="alert alert-danger" role="alert">
                                Some fields are missing
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <div class="mb-3">
                                    <label for="exampleFormControlInput1" class="form-label">Card#</label>
                                    <input type="text" class="form-control" id="exampleFormControlInput1"
                                        placeholder="XXXXXXXXXXXXXXXXX">

                                </div>

                            </div>
                            <div class="col-3">
                                <div class="mb-3">
                                    <label for="exampleFormControlInput2" class="form-label">CVC#</label>
                                    <input type="text" class="form-control" id="exampleFormControlInput2"
                                        placeholder="0000">
                                </div>
                            </div>

                            <div class="col-4">
                                <div class="mb-3">
                                    <label for="exampleFormControlInput3" class="form-label">Amount#</label>
                                    <div class="d-flex">
                                        $
                                        <input type="text" class="form-control" id="exampleFormControlInput3"
                                            placeholder="Amount">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <div class="mb-3">
                                    <label for="exampleFormControlInput4" class="form-label">First Name</label>
                                    <input type="text" class="form-control" id="exampleFormControlInput4"
                                        placeholder="">
                                </div>
                            </div>
                            <div class="col">
                                <div class="mb-3">
                                    <label for="exampleFormControlInput5" class="form-label">Last Name</label>
                                    <input type="text" class="form-control" id="exampleFormControlInput5"
                                        placeholder="">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-6">
                                <div class="mb-3">
                                    <label for="exampleFormControlInput6" class="form-label">City</label>
                                    <input type="text" class="form-control" id="exampleFormControlInput6"
                                        placeholder="">

                                </div>

                            </div>
                            <div class="col-3">
                                <div class="mb-3">
                                    <label for="exampleFormControlInput2" class="form-label">State</label>
                                    <select class="form-select" aria-label="Large select example">
                                        <option selected>Pick a state</option>
                                        <option value="1">Catalunya</option>
                                        <option value="2">Murcia</option>
                                        <option value="3">Pais vasco</option>
                                    </select>
                                </div>
                            </div>

                            <div class="col-3">
                                <div class="mb-3">
                                    <label for="exampleFormControlInput8" class="form-label">Postal Code#</label>
                                    <div class="d-flex">

                                        <input type="text" class="form-control" id="exampleFormControlInput8"
                                            placeholder="">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <label for="" class="form-label">We accept:</label>
                                <div class="col">

                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="inlineRadioOptions"
                                            id="inlineRadio1" value="option1">
                                        <label class="form-check-label" for="inlineRadio1"><i
                                                class="fa-brands fa-cc-mastercard"></i></label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="inlineRadioOptions"
                                            id="inlineRadio2" value="option2">
                                        <label class="form-check-label" for="inlineRadio2"><i
                                                class="fa-brands fa-cc-visa"></i></label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="inlineRadioOptions"
                                            id="inlineRadio3" value="option3">
                                        <label class="form-check-label" for="inlineRadio3"><i
                                                class="fa-brands fa-cc-diners-club"></i></label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="inlineRadioOptions"
                                            id="inlineRadio3" value="option4">
                                        <label class="form-check-label" for="inlineRadio3"><i
                                                class="fa-brands fa-cc-amex"></i></label>
                                    </div>
                                </div>
                            </div>
                            <div class="col">
                                <label for="exampleFormControlTextarea1" class="form-label">Message</label>
                                <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                                <p>Add any notes here</p>
                            </div>
                        </div>
                    </form>

                </div>
                <div class="card-footer text-body-secondary">
                    <div class="row d-flex justify-content-end">
                        <div class="col-2">

                            <button class="btn btn-secondary">Cancel</button>
                            <button class="btn btn-primary">Send</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>



    <!-- Bootstrap - componentes de JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
